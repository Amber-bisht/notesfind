name: Build and Deploy

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >>${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/notesfind:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >>${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          # Use key if you have it instead of password:
          # key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Create project directory if not exists
            mkdir -p ~/notesfind
            cd ~/notesfind
            
            # Login to GitHub Registry on the VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Create a minimal docker-compose for the VPS
            cat <<EOF > docker-compose.yml
            version: '3.8'
            services:
              web:
                image: ghcr.io/${{ env.OWNER_LC }}/notesfind:latest
                ports:
                  - "3000:3000"
                env_file:
                  - .env
                restart: always
                depends_on:
                  - mongodb
                  - redis
              
              mongodb:
                image: mongo:latest
                volumes:
                  - mongodb_data:/data/db
                restart: always

              redis:
                image: redis:alpine
                restart: always

            volumes:
              mongodb_data:
            EOF
            
            # Create/Update .env file
            echo "${{ secrets.DOTENV }}" > .env
            
            # Pull and Restart
            docker compose pull
            docker compose up -d
            
            # Cleanup old images
            docker image prune -f
